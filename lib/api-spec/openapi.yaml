openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BizPulse API — AI-Powered Business Identity and Intelligence Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: businesses
    description: Business operations
  - name: alerts
    description: Intelligence alerts
  - name: resolve
    description: Entity resolution
  - name: stats
    description: Platform statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List all businesses
      description: Returns all registered businesses with their UBID profiles
      parameters:
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

  /businesses/{ubid}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get business by UBID
      description: Returns full 360° profile for a business
      parameters:
        - name: ubid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Business not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List active intelligence alerts
      description: Returns AI-generated business intelligence alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntelligenceAlert"

  /resolve:
    post:
      operationId: resolveEntities
      tags: [resolve]
      summary: Run AI entity resolution
      description: Matches fragmented business records across databases and assigns UBIDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Resolution results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get platform statistics
      description: Returns high-level platform stats for the landing page
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /sector-analytics:
    get:
      operationId: getSectorAnalytics
      tags: [stats]
      summary: Get sector compliance analytics
      description: Returns compliance rates by district and sector
      responses:
        "200":
          description: Sector analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorAnalytic"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ComplianceStatus:
      type: object
      properties:
        department:
          type: string
        status:
          type: string
          enum: [compliant, warning, non_compliant, pending]
        expiresAt:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
      required:
        - department
        - status

    Business:
      type: object
      properties:
        ubid:
          type: string
        name:
          type: string
        owner:
          type: string
        city:
          type: string
        sector:
          type: string
        gstin:
          type: string
          nullable: true
        udyam:
          type: string
          nullable: true
        municipalLicence:
          type: string
          nullable: true
        fssai:
          type: string
          nullable: true
        complianceScore:
          type: integer
        turnover:
          type: array
          items:
            type: number
        status:
          type: string
          enum: [Active, "Action Required", Non-Compliant]
        alerts:
          type: array
          items:
            type: string
        compliance:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceStatus"
        directors:
          type: array
          items:
            type: string
        address:
          type: string
        registrationDate:
          type: string
      required:
        - ubid
        - name
        - owner
        - city
        - sector
        - complianceScore
        - turnover
        - status
        - alerts
        - compliance

    IntelligenceAlert:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        category:
          type: string
        title:
          type: string
        description:
          type: string
        district:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        affectedCount:
          type: integer
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - severity
        - category
        - title
        - description
        - createdAt

    RawRecord:
      type: object
      properties:
        source:
          type: string
        name:
          type: string
        pan:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
      required:
        - source
        - name

    ResolveRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/RawRecord"
      required:
        - records

    MatchScore:
      type: object
      properties:
        fuzzyName:
          type: number
        panCrossRef:
          type: number
        addressSimilarity:
          type: number
        overall:
          type: number
      required:
        - fuzzyName
        - panCrossRef
        - addressSimilarity
        - overall

    ResolvedEntity:
      type: object
      properties:
        ubid:
          type: string
        canonicalName:
          type: string
        matchedRecords:
          type: array
          items:
            $ref: "#/components/schemas/RawRecord"
        scores:
          $ref: "#/components/schemas/MatchScore"
      required:
        - ubid
        - canonicalName
        - matchedRecords
        - scores

    ResolveResponse:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedEntity"
        totalInputRecords:
          type: integer
        totalResolved:
          type: integer
        processingTimeMs:
          type: integer
      required:
        - entities
        - totalInputRecords
        - totalResolved
        - processingTimeMs

    PlatformStats:
      type: object
      properties:
        totalBusinesses:
          type: integer
        unifiedToday:
          type: integer
        complianceRate:
          type: number
        activeAlerts:
          type: integer
        districtsActive:
          type: integer
        sectorsMonitored:
          type: integer
      required:
        - totalBusinesses
        - unifiedToday
        - complianceRate
        - activeAlerts
        - districtsActive
        - sectorsMonitored

    SectorAnalytic:
      type: object
      properties:
        district:
          type: string
        sector:
          type: string
        complianceRate:
          type: number
        totalBusinesses:
          type: integer
        compliantCount:
          type: integer
      required:
        - district
        - sector
        - complianceRate
        - totalBusinesses
        - compliantCount
