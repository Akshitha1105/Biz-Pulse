kind = "web"
previewPath = "/"
title = "BizPulse"
version = "1.0.0"
id = "artifacts/bizpulse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22521

[services.development]
run = "pnpm --filter @workspace/bizpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bizpulse", "run", "build" ]
publicDir = "artifacts/bizpulse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22521"
BASE_PATH = "/"
